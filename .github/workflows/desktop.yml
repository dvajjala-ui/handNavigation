name: HandNavigate Desktop
on:
  workflow_dispatch:
  push:
    paths: ['desktop/**', 'service/**', 'package.json', 'package-lock.json', 'Invoke-HandNavigate.ps1', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['desktop/**', 'service/**', 'package.json', 'package-lock.json', 'Invoke-HandNavigate.ps1', '.github/workflows/desktop.yml']
permissions:
  contents: read
jobs:
  windows-app:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:desktop
      - run: npm run dist
      - run: npm run test:packaged
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: handnavigate-windows
          path: |
            dist/HandNavigate-*-Windows.exe
            desktop/evidence/**
