name: Remote local-model acceptance
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/local-model-acceptance.yml']
permissions:
  contents: read
jobs:
  real-local-model:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install app and browser
        run: |
          python -m pip install -r windows-agent/requirements.txt
          python -m playwright install --with-deps chrome
      - name: Start isolated CPU Ollama on this remote test host
        run: |
          docker run -d --name acceptance-ollama -p 127.0.0.1:11434:11434 -e OLLAMA_NO_CLOUD=1 ollama/ollama:0.40.14
          for attempt in $(seq 1 30); do curl --fail --silent http://127.0.0.1:11434/api/version && break; sleep 1; done
          curl --fail --silent http://127.0.0.1:11434/api/version
          docker exec acceptance-ollama ollama pull qwen3.5:4b
      - name: Verify model plans and stop browser actions at the first independent success
        run: python windows-agent/tools/accept_local_model.py --model qwen3.5:4b --output windows-agent/evidence/remote-local-model.json
      - name: Retain real inference evidence without model files or profiles
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remote-local-model-${{ github.run_id }}
          path: windows-agent/evidence/remote-local-model.json
          retention-days: 7
      - name: Stop the test-only model server
        if: always()
        run: docker stop acceptance-ollama || true
