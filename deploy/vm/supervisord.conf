[supervisord]
nodaemon=true
logfile=/tmp/handnavigate-supervisor.log
pidfile=/tmp/handnavigate-supervisor.pid
childlogdir=/tmp

[program:display]
command=Xvfb :99 -screen 0 1360x900x24 -nolisten tcp
autorestart=true
priority=10

[program:desktop]
command=openbox
autorestart=true
priority=20

[program:vnc]
command=x11vnc -display :99 -localhost -rfbport 5900 -forever -shared -nopw
autorestart=true
priority=30

[program:console]
command=websockify --web=/usr/share/novnc 0.0.0.0:6080 127.0.0.1:5900
autorestart=true
priority=40

[program:worker]
command=node /app/service/server.cjs
autorestart=true
priority=50
stopwaitsecs=90
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
