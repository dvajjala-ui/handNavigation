services:
  worker:
    build:
      context: ../..
      dockerfile: deploy/vm/Dockerfile
    init: true
    restart: unless-stopped
    shm_size: 1gb
    stop_grace_period: 100s
    env_file: ./worker.env
    ports:
      - "127.0.0.1:47832:47832"
      - "127.0.0.1:6080:6080"
    volumes:
      - handnavigate-data:/data
volumes:
  handnavigate-data:
